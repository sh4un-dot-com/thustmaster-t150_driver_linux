# Prefer hid-t150 over hid-generic when both are being loaded.
# udev still rebinds if hid-generic wins the race on an already-booted system.
softdep hid-generic pre: hid-t150
#
# Plug-in wheel-feel preset (sim arcade street offroad rally drift truck).
# Default is sim. Uncomment to change:
# options hid-t150 preset=sim

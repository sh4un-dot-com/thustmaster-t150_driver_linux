# Load ht150 when a T150/TMX (or the 044f:b65d boot identity) is plugged in.
# kld_list already loads the module at boot; this covers hotplug after kldunload.

notify 100 {
	match "system"		"USB";
	match "subsystem"	"DEVICE";
	match "type"		"ATTACH";
	match "vendor"		"0x044f";
	match "product"		"0xb677";
	action			"/sbin/kldstat -q -m ht150 || /sbin/kldload ht150";
};

